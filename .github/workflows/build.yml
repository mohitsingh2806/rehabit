name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish releases
    env:
      REHABIT_KEYSTORE_PASSWORD: ${{ secrets.REHABIT_KEYSTORE_PASSWORD }}
      REHABIT_KEY_ALIAS: ${{ secrets.REHABIT_KEY_ALIAS }}
      REHABIT_KEY_PASSWORD: ${{ secrets.REHABIT_KEY_PASSWORD }}
      # SHA-256 of the permanent signing certificate (public, not secret).
      EXPECTED_CERT_SHA256: 8b6fb9d6580caecbde45e5efed79c6516a09f13030e6eaabcd0c9b5966d53b07
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # No gradlew in the repo yet, so install Gradle directly.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.REHABIT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets missing - refusing to build an APK that can't update the installed app"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rehabit.jks"
          echo "REHABIT_KEYSTORE_PATH=$RUNNER_TEMP/rehabit.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK is signed with the permanent key
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/*.apk | tee certs.txt
          grep -q "SHA-256 digest: $EXPECTED_CERT_SHA256" certs.txt || { echo "::error::APK signed with wrong key"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: rehabit-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Each push to main becomes a release with the APK attached as "rehabit.apk", so
      # /releases/latest/download/rehabit.apk always points at the newest build (no sign-in needed).
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/rehabit.apk"
          git log -1 --format=%B > "$RUNNER_TEMP/notes.md"
          TAG="build-${{ github.run_number }}"
          TITLE="Build ${{ github.run_number }} · $(git log -1 --format=%s)"
          gh release create "$TAG" "$RUNNER_TEMP/rehabit.apk" --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md" --latest
